spring.application.name=ulpf

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ulp_framework}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2409}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
sspring.kafka.consumer.group-id=logfusion-ai-workers
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.group-id=logfusion-ai-workers
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.ntro.ulpf.kafka.AiLogJob
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.ntro.ulpf.kafka
logfusion.kafka.topics.raw-ai=${KAFKA_RAW_AI_TOPIC:raw-ai-logs}
logfusion.kafka.topics.normalized=${KAFKA_NORMALIZED_TOPIC:normalized-logs}
logfusion.kafka.topics.dlq=${KAFKA_DLQ_TOPIC:ai-processing-dlq}
