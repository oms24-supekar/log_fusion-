spring.application.name=ulpf

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ulp_framework}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2409}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false



# Ollama
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000

spring.kafka.consumer.group-id=logfusion-ai-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.ntro.ulpf.kafka.AiLogJob
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.ntro.ulpf.kafka

logfusion.kafka.topics.raw-ai=${KAFKA_RAW_AI_TOPIC:raw-ai-logs}
logfusion.kafka.topics.normalized=${KAFKA_NORMALIZED_TOPIC:normalized-logs}
logfusion.kafka.topics.dlq=${KAFKA_DLQ_TOPIC:ai-processing-dlq}# Batch processing
logfusion.batch.storage-dir=${LOGFUSION_BATCH_STORAGE_DIR:./data/batches}

spring.servlet.multipart.max-file-size=${MAX_BATCH_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_BATCH_REQUEST_SIZE:1GB}
# AUTH / JWT
app.jwt.secret=${JWT_SECRET:change-me-local-only-change-me-local-only-123456}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.bootstrap-admin.email=${ADMIN_EMAIL:admin@logfusion.local}
app.bootstrap-admin.password=${ADMIN_PASSWORD:ChangeThisPassword123!}
app.bootstrap-admin.name=${ADMIN_NAME:LogFusion Admin}

